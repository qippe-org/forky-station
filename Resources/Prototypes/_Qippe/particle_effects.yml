- type: particleEffect
  id: Bullet
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: cross
  shader: unshaded
  startColor: "#c8c8c8bf"
  endColor: "#c8c8c866"
  particleSize: 0.33
  sizeVariance: 0.1
  stretchFactor: 0.2
  lifetime: 1.5
  lifetimeVariance: 1.5
  speed: 0.05
  speedVariance: 0.02
  gravity: 0.05
  startRotationVariance: 180
  emissionRate: 100
  maxCount: 200
  shape:
    type: Point
    radius: 0.1
  spreadAngle: 360

- type: particleEffect
  id: GrenadeProjectile
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: cross
  shader: unshaded
  colorOverLifetime:
    - time: 0.0
      color: "#FCE6B6FF"
    - time: 0.2
      color: "#FBAF4DFF"
    - time: 0.5
      color: "#FD6B1CFF"
    - time: 0.8
      color: "#CC220088"
    - time: 1.0
      color: "#40000022"
  alphaOverLifetime:
    - time: 0.0
      value: 0.5
    - time: 0.05
      value: 1.0
    - time: 0.7
      value: 1.0
    - time: 1.0
      value: 0.5
  particleSize: 0.33
  sizeVariance: 0.1
  stretchFactor: 0.2
  lifetime: 1
  lifetimeVariance: 0.5
  speed: 0.05
  speedVariance: 0.02
  gravity: 0.05
  startRotationVariance: 180
  emissionRate: 100
  maxCount: 200
  shape:
    type: Point
    radius: 0.1
  spreadAngle: 360
